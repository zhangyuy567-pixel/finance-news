name: 每日财经新闻自动收集

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 抓取新闻
        run: python scripts/fetch_news.py
      - name: 提交更新
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git pull --rebase || true
          touch .nojekyll
          git add data/ .nojekyll
          git diff --staged --quiet || (git commit -m "📰 每日财经新闻更新 $(date +'%Y-%m-%d')" && git push)
